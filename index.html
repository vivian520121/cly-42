<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日解谜 | Daily Puzzle</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dark-mode">
    <div class="app-container">
        <header class="app-header">
            <div class="header-left">
                <h1 class="app-title">每日解谜</h1>
                <span class="date-display" id="dateDisplay"></span>
            </div>
            <div class="header-right">
                <span class="timer-display" id="timerDisplay">00:00</span>
                <span class="puzzle-type" id="puzzleType"></span>
                <button class="icon-btn" id="statsBtn" title="通关记录">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="3" y1="9" x2="21" y2="9"></line>
                        <line x1="9" y1="21" x2="9" y2="9"></line>
                    </svg>
                </button>
                <button class="icon-btn" id="themeBtn" title="切换主题">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </div>
        </header>

        <main class="main-content">
            <section class="puzzle-section" id="puzzleSection">
                <div class="puzzle-meta">
                    <span class="puzzle-number" id="puzzleNumber"></span>
                    <span class="difficulty" id="difficulty"></span>
                </div>

                <div class="puzzle-content" id="puzzleContent"></div>

                <div class="hints-section">
                    <div class="hints-header">
                        <h3>提示</h3>
                        <span class="hints-used" id="hintsUsed">0/3</span>
                    </div>
                    <div class="hints-container" id="hintsContainer">
                        <button class="hint-btn" data-level="1">获取提示 1</button>
                        <button class="hint-btn" data-level="2">获取提示 2</button>
                        <button class="hint-btn" data-level="3">获取提示 3</button>
                    </div>
                    <div class="hint-content" id="hintContent"></div>
                </div>

                <div class="answer-section">
                    <div class="graphical-chooser" id="graphicalChooser"></div>
                    <div class="answer-input-wrapper">
                        <input type="text" id="answerInput" class="answer-input" placeholder="输入你的答案..." autocomplete="off">
                        <button class="submit-btn" id="submitBtn">提交</button>
                    </div>
                    <div class="answer-result" id="answerResult"></div>
                    
                    <div class="collapsible-section">
                        <button class="collapsible-btn" id="showAnswerBtn">
                            <span class="collapsible-icon">▶</span>
                            查看答案
                        </button>
                        <div class="collapsible-content" id="answerCollapsed">
                            <div class="answer-text" id="correctAnswer"></div>
                            <div class="answer-explanation" id="answerExplanation"></div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="canvas-section">
                <div class="canvas-header">
                    <h3>草稿本</h3>
                    <div class="canvas-controls">
                        <button class="canvas-btn" id="clearCanvas" title="清空画布">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="3 6 5 6 21 6"></polyline>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                            </svg>
                        </button>
                        <button class="canvas-btn" id="undoCanvas" title="撤销">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="1 4 1 10 7 10"></polyline>
                                <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
                            </svg>
                        </button>
                        <div class="color-picker">
                            <button class="color-btn active" data-color="#e0e0e0" style="background: #e0e0e0;"></button>
                            <button class="color-btn" data-color="#64b5f6" style="background: #64b5f6;"></button>
                            <button class="color-btn" data-color="#81c784" style="background: #81c784;"></button>
                            <button class="color-btn" data-color="#e57373" style="background: #e57373;"></button>
                            <button class="color-btn" data-color="#ffb74d" style="background: #ffb74d;"></button>
                        </div>
                        <div class="brush-size">
                            <input type="range" id="brushSize" min="1" max="20" value="3">
                        </div>
                    </div>
                </div>
                <canvas id="draftCanvas"></canvas>
            </section>
        </main>

        <div class="modal" id="statsModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>通关记录</h2>
                    <button class="close-btn" id="closeStats">&times;</button>
                </div>
                <div class="tabs">
                    <button class="tab-btn active" data-tab="records">我的记录</button>
                    <button class="tab-btn" data-tab="leaderboard">排行榜</button>
                </div>
                <div class="tab-content">
                    <div class="tab-pane active" id="tab-records">
                        <div class="stats-body" id="statsBody"></div>
                    </div>
                    <div class="tab-pane" id="tab-leaderboard">
                        <div class="leaderboard-body" id="leaderboardBody"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal" id="completedModal">
            <div class="modal-content success-modal">
                <div class="success-icon">✓</div>
                <h2>恭喜通关！</h2>
                <p id="completedMessage"></p>
                <div class="modal-actions">
                    <button class="primary-btn" id="closeCompleted">继续</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/puzzles.js"></script>
    <script src="js/canvas.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
